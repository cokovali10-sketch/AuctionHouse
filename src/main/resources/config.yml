# AuctionHouse v1.7.1 - Purpur/Paper 1.21.11
# Economy: Vault + EssentialsX (1 diamond ~ 1000$ on your server)
general:
  # prefix in chat (supports color codes with &)
  prefix: "&8[&6Auction&eHouse&8] "
  language: ru
  # check expired listings every N minutes
  expire-check-minutes: 5
  # notify seller on buy (true/false)
  sold-message: true
  # announce expensive listings? 0 = disabled
  announce-min-price: 0.0

economy:
  # 10% commission from seller on successful sale
  tax-percent: 10.0
  # min/max listing price (with your inflation: diamond ~1000$)
  min-price: 1.0
  max-price: 100000000.0
  # currency symbol for GUI/messages
  symbol: "$"

exchange:
  # exchanger: diamonds <-> money (buttons in /ah + /ah exchange)
  enabled: true
  # price of ONE diamond in both directions
  diamond-price: 1000.0

listings:
  # max active listings per player (100 slots as requested)
  max-per-player: 100
  # lifetime of each listing in seconds: 7 days = 604800
  duration-seconds: 604800
  # allow selling damaged items? shulkers with items? (anti-dupe safe: true)
  allow-damaged: true
  # blocked materials (one per line, e.g. BEDROCK, COMMAND_BLOCK)
  blocked:
    - BEDROCK
    - BARRIER
    - COMMAND_BLOCK
    - STRUCTURE_BLOCK
  # worlds where /ah sell is denied (e.g. pvp_world). Empty = everywhere allowed.
  blocked-worlds: []

gui:
  title-main: "<gradient:#FFD76A:#7AD9FF>◆ Аукцион ◆</gradient> <gray>стр. {page} • {count} лотов"
  title-confirm: "<gradient:#7DFF9A:#FFE27A>◆ Сделка ◆</gradient>"
  title-mylots: "<gradient:#7AD9FF:#FFD76A>◆ Мои лоты ◆</gradient> <gray>{count}/{max}"
  title-expired: "<gradient:#FFD76A:#7AD9FF>◆ Склад ◆</gradient>"
  # sort modes cycled by button: NEWEST, PRICE_ASC, PRICE_DESC, TIME_LEFT
  default-sort: NEWEST
  # filler glass pane material
  filler: BLACK_STAINED_GLASS_PANE
  # UI sounds (UI clicks, levelup on buy, villager on sell)
  sounds: true
  # default category filter: ALL, BLOCKS, TOOLS, WEAPONS, ARMOR, FOOD, POTIONS, ENCHANTED, MISC
  default-category: ALL

style:
  # rarity tiers by price: RARE badge + EPIC badge with glow
  rare-at: 10000.0
  epic-at: 100000.0

storage:
  # YAML file storage: plugins/AuctionHouse/listings.yml (no MySQL needed on Gamely)
  file: listings.yml
  # autosave every N minutes
  autosave-minutes: 10
